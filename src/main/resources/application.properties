spring.application.name=cinebox

spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB

# SQLite database
spring.datasource.url=jdbc:sqlite:${CINEBOX_DB_PATH:./data/cinebox.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Person profile image storage
cinebox.person-profiles.storage.root=${CINEBOX_PROFILE_STORAGE_PATH:./data/person-profiles}
cinebox.person-profiles.storage.marker-file-name=.cinebox-profile-storage

# Scheduled person profile storage validation
cinebox.person-profiles.validation.initial-delay-ms=30000
cinebox.person-profiles.validation.fixed-delay-ms=300000